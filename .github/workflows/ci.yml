# Continuous integration.
#
# The auth tests are the ones that matter most here: they are what stops the
# browser-redirect sign-in — the cause of the previous App Store rejection —
# from coming back.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']

    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose. The action reads `packageManager` from
      # package.json, and specifying both makes it throw
      # "Multiple versions of pnpm specified" before it installs anything.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Database schema and RLS tests
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGPASSWORD: postgres
        run: bash supabase/tests/run.sh
